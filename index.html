<style>

    --bg:#0f1419; --panel:#1a2230; --panel2:#222c3d; --line:#2c3646;

    --teal:#14b8a6; --slate:#64748b; --pink:#ec4899;
    --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','Cairo',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
  body[dir="rtl"]{font-family:'Cairo','Inter',system-ui,sans-serif}
  #root{min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:600;transition:.15s}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{font-family:inherit;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
  a{color:var(--brand)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .btn-primary{background:var(--brand);color:#fff;padding:11px 18px}
  .btn-primary:hover{background:var(--brand2)}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:9px 14px}
  .btn-ghost:hover{color:var(--ink);border-color:var(--brand)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700}
  .spin{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--brand);
    border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .row{display:flex;gap:12px;align-items:center}
  .grid{display:grid;gap:14px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:11px 12px;text-align:start;border-bottom:1px solid var(--line);font-size:13.5px}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  tr:hover td{background:var(--panel2)}
  .stat{padding:18px 20px}
  .stat .num{font-size:30px;font-weight:800;line-height:1}
  .stat .lbl{color:var(--muted);font-size:12.5px;margin-top:7px;font-weight:600}
  .tabbar{display:flex;gap:4px;background:var(--panel);padding:5px;border-radius:12px;border:1px solid var(--line)}
  .tabbar button{flex:1;padding:10px;background:transparent;color:var(--muted)}
  .tabbar button.active{background:var(--brand);color:#fff}
  .toast{position:fixed;bottom:22px;inset-inline-end:22px;background:var(--panel2);
    border:1px solid var(--line);border-inline-start:4px solid var(--green);
    padding:13px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:99;max-width:340px}
  .toast.err{border-inline-start-color:var(--red)}
  label.fld{display:block;margin-bottom:14px}
  label.fld span{display:block;color:var(--muted);font-size:12.5px;margin-bottom:6px;font-weight:600}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;
    justify-content:center;z-index:50;padding:16px}
  .mini{padding:14px 16px}
  .mini .num{font-size:23px;font-weight:800;line-height:1}
  .mini .lbl{color:var(--muted);font-size:11.5px;margin-top:5px;font-weight:600}
  @media print{
    @page{margin:14mm}
    body{background:#fff !important;color:#111 !important}
    .no-print{display:none !important}
    .card{box-shadow:none !important;border:1px solid #ccc !important;background:#fff !important;
      break-inside:avoid}
    .stat .num,.mini .num{color:#111 !important}
    .lbl,.mini .lbl,th{color:#444 !important}
    table,td,th{border-color:#ccc !important}
    #root>div>div{max-width:100% !important}
    .print-area,.print-area *{visibility:visible}
    .pill{border:1px solid #ccc}
  }

const OUTCOME_COLORS = {
  answered:"var(--green)", no_answer:"var(--slate)", call_back:"var(--amber)",
  interested:"var(--teal)", not_interested:"var(--muted)",
  wrong_number:"var(--violet)", blacklisted:"var(--red)", new:"var(--brand)"

/* ---------------- small helpers ---------------- */
function useToast(){
  const [toast,setToast]=useState(null);
  const show=useCallback((msg,err=false)=>{
    setToast({msg,err}); setTimeout(()=>setToast(null),3200);
  },[]);
  const node = toast ? <div className={"toast"+(toast.err?" err":"")}>{toast.msg}</div> : null;
  return [node,show];
}
function Pill({outcome,t}){
  const c=OUTCOME_COLORS[outcome]||"var(--slate)";
  return <span className="pill" style={{background:c+"22",color:c}}>
    <span style={{width:7,height:7,borderRadius:"50%",background:c}}></span>
    {t.outcomes[outcome]||outcome}</span>;
}
function fmtDate(s,dir){
  if(!s) return "—";
  const d=new Date(s);
  return d.toLocaleString(dir==="rtl"?"ar-EG":"en-GB",
    {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
}

/* ---------------- WhatsApp ---------------- */
// Convert an Egyptian number to international format for wa.me (20 + number without leading 0)
function waPhone(raw){
  let d=(raw||"").replace(/\D/g,"");
  if(d.startsWith("0")) d=d.slice(1);        // drop leading 0
  if(!d.startsWith("20")) d="20"+d;          // add Egypt country code
  return d;
}
// Pre-written professional reminder message for براذر كوند للتكييف, personalized with name
function waMessage(name){
  const n=(name&&name.trim())?name.trim():"عميلنا العزيز";
  return (
`الأستاذ/ة ${n}، تحية طيبة،

منذ عام 1990 وبراذر كوند للتكييف تفخر بثقة عملائها الكرام، وأنتم من عملائنا الأعزاء الذين نعتز بهم.

نضع خبرتنا الممتدة لأكثر من ثلاثة عقود في مجال أنظمة التكييف — تركيباً وصيانةً وخدمات ما بعد البيع — في خدمتكم دائماً، بمعايير الجودة التي عُرفنا بها.

يسعدنا استمرار تعاوننا، ونحن هنا لأي استفسار أو دعم تحتاجونه.

مع خالص التقدير،
فريق براذر كوند للتكييف`);
}
function waLink(client){
  return "https://wa.me/"+waPhone(client.phone)+"?text="+encodeURIComponent(waMessage(client.name));
}

/* ==================== LOGIN ==================== */
function Login({lang,setLang,onLogin}){
  const t=T[lang];
  const [email,setEmail]=useState(""),[pw,setPw]=useState("");
  const [busy,setBusy]=useState(false),[err,setErr]=useState("");
  async function submit(){
    setBusy(true); setErr("");
    const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
    setBusy(false);
    if(error){ setErr(t.loginErr); return; }
    onLogin();
  }
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div className="card" style={{width:400,maxWidth:"100%",padding:32}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <div style={{width:44,height:44,borderRadius:12,background:"var(--brand)",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>📞</div>
          <button className="btn-ghost" style={{padding:"6px 12px"}}
            onClick={()=>setLang(lang==="en"?"ar":"en")}>{lang==="en"?"العربية":"English"}</button>
        </div>
        <h1 style={{margin:"14px 0 2px",fontSize:26,fontWeight:800}}>{t.appName}</h1>
        <p style={{color:"var(--muted)",margin:"0 0 24px",fontSize:14}}>{t.tagline}</p>
        <label className="fld"><span>{t.email}</span>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&submit()} autoFocus/></label>
        <label className="fld"><span>{t.password}</span>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&submit()}/></label>
        {err && <div style={{color:"var(--red)",fontSize:13,marginBottom:12}}>{err}</div>}
        <button className="btn-primary" style={{width:"100%"}} disabled={busy} onClick={submit}>
          {busy?t.signingIn:t.login}</button>
      </div>
    </div>
  );
}

/* ==================== LOG CALL MODAL (with inline edit) ==================== */
const EDITABLE_STATUSES = ["new","no_answer","wrong_number"];
function LogCallModal({t,client,me,onClose,onSaved,showToast}){
  const [outcome,setOutcome]=useState("");
  const [feedback,setFeedback]=useState("");
  const [cbAt,setCbAt]=useState("");
  const [busy,setBusy]=useState(false);
  // editable client fields
  const [name,setName]=useState(client.name||"");
  const [city,setCity]=useState(client.city||"");
  const [location,setLocation]=useState(client.location||"");

  const isAdmin = me.role==="admin";
  const canEdit = isAdmin || EDITABLE_STATUSES.includes(client.status);
  const changed = name!==(client.name||"") || city!==(client.city||"") || location!==(client.location||"");

  async function save(){
    if(!outcome){ showToast(t.pickOutcome,true); return; }
    setBusy(true);
    // 1. If the agent changed client info, save it first — but only if allowed.
    if(changed){
      if(!canEdit){ setBusy(false); showToast(t.editLocked,true); return; }
      const {error:eUp}=await sb.from("clients")
        .update({name:name.trim(),city:city.trim(),location:location.trim()})
        .eq("id",client.id);
      if(eUp){ setBusy(false); showToast(eUp.message,true); return; }
    }
    // 2. Insert the call log (this also updates status via trigger).
    const row={client_id:client.id, agent_id:me.id, outcome, feedback:feedback||null,
      callback_at: (outcome==="call_back" && cbAt)? new Date(cbAt).toISOString(): null};
    const {error}=await sb.from("call_logs").insert(row);
    setBusy(false);
    if(error){ showToast(error.message,true); return; }
    onSaved();
  }
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="card" style={{width:480,maxWidth:"100%",padding:26,maxHeight:"88vh",overflow:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:12,color:"var(--muted)",fontWeight:600}}>{t.markResult}</div>
        <h2 style={{margin:"3px 0 4px",fontSize:21,fontWeight:800}}>{client.name||"—"}</h2>
        <div className="row" style={{gap:8,marginBottom:18,flexWrap:"wrap"}}>
          <a href={"tel:"+client.phone} className="pill" style={{background:"var(--brand)22",color:"var(--brand)",fontSize:14,textDecoration:"none"}}>
            📞 {client.phone}</a>

/* ==================== ADMIN: ASSIGN ==================== */
function AdminAssign({t,showToast}){
  const [agents,setAgents]=useState([]);
  const [agentId,setAgentId]=useState("");
  const [count,setCount]=useState(50);
  const [city,setCity]=useState("");
  const [onlyNew,setOnlyNew]=useState(true);
  const [cities,setCities]=useState([]);
  const [busy,setBusy]=useState(false);
  const [avail,setAvail]=useState(null);

  useEffect(()=>{(async()=>{
    const {data:ag}=await sb.from("profiles").select("*").eq("role","agent").eq("active",true);
    setAgents(ag||[]);
    const {data:cl}=await sb.from("clients").select("city");
    setCities([...new Set((cl||[]).map(c=>c.city).filter(Boolean))].sort());
  })();},[]);

  const checkAvail=useCallback(async()=>{
    let query=sb.from("clients").select("id",{count:"exact",head:true})
      .is("assigned_to",null).eq("do_not_call",false);
    if(onlyNew) query=query.eq("status","new");
    if(city) query=query.eq("city",city);
    const {count:c}=await query;
    setAvail(c||0);
  },[city,onlyNew]);
  useEffect(()=>{checkAvail();},[checkAvail]);

  async function assign(){
    if(!agentId){ showToast(t.selectAgent,true); return; }
    setBusy(true);
    let query=sb.from("clients").select("id").is("assigned_to",null).eq("do_not_call",false);
    if(onlyNew) query=query.eq("status","new");
    if(city) query=query.eq("city",city);
    query=query.limit(count);
    const {data:rows,error}=await query;
    if(error){ setBusy(false); showToast(error.message,true); return; }
    const ids=(rows||[]).map(r=>r.id);
    if(ids.length===0){ setBusy(false); showToast(t.noData,true); return; }
    const {error:e2}=await sb.from("clients").update({assigned_to:agentId}).in("id",ids);
    setBusy(false);
    if(e2){ showToast(e2.message,true); return; }
    const a=agents.find(x=>x.id===agentId);
    showToast(t.assigned.replace("{n}",ids.length).replace("{a}",a?.full_name||""));
    checkAvail();
  }

  return (
    <div className="grid" style={{gap:16,maxWidth:560}}>
      <div style={{fontSize:20,fontWeight:800}}>{t.assignClients}</div>
      <div className="card" style={{padding:22}}>
        <label className="fld"><span>{t.selectAgent}</span>
          <select value={agentId} onChange={e=>setAgentId(e.target.value)}>
            <option value="">—</option>
            {agents.map(a=><option key={a.id} value={a.id}>{a.full_name}</option>)}
          </select></label>
        <label className="fld"><span>{t.byCity}</span>
          <select value={city} onChange={e=>setCity(e.target.value)}>
            <option value="">{t.allCities}</option>
            {cities.map(c=><option key={c} value={c}>{c}</option>)}
          </select></label>
        <label className="fld"><span>{t.howMany}</span>
          <input type="number" min="1" max="1000" value={count}
            onChange={e=>setCount(Math.max(1,parseInt(e.target.value)||1))}/></label>
        <label className="row" style={{gap:9,marginBottom:18,cursor:"pointer"}}>
          <input type="checkbox" style={{width:"auto"}} checked={onlyNew}
            onChange={e=>setOnlyNew(e.target.checked)}/>
          <span style={{color:"var(--muted)",fontSize:14}}>{t.onlyNew}</span></label>
        <div style={{fontSize:13,color:"var(--muted)",marginBottom:14}}>
          {avail===null?"…":avail} {t.unassigned.toLowerCase()} · {t.remaining}</div>
        <button className="btn-primary" style={{width:"100%"}} disabled={busy} onClick={assign}>
          {busy?t.saving:t.assignNow}</button>
      </div>
    </div>
  );
}

/* ==================== DONUT CHART (SVG, no libs) ==================== */
function Donut({data,size=150}){
  const total=data.reduce((a,d)=>a+d.value,0);
  const r=size/2-14, cx=size/2, cy=size/2, C=2*Math.PI*r;
  let acc=0;
  return (
    <svg width={size} height={size} viewBox={"0 0 "+size+" "+size} style={{transform:"rotate(-90deg)"}}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--panel2)" strokeWidth="14"/>
      {total>0 && data.filter(d=>d.value>0).map((d,i)=>{
        const frac=d.value/total, dash=frac*C;
        const el=<circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={d.color}
          strokeWidth="14" strokeDasharray={dash+" "+(C-dash)}
          strokeDashoffset={-acc*C} strokeLinecap="butt"/>;
        acc+=frac; return el;
      })}
    </svg>
  );
}

/* ==================== ADMIN: CONFIRMED / CLEAN DATA ==================== */
function AdminConfirmed({t,showToast}){
  const [rows,setRows]=useState(null);
  const [q,setQ]=useState(""); const [cityF,setCityF]=useState("");
  const load=useCallback(async()=>{
    const {data}=await sb.from("confirmed_clients").select("*").order("reached_at",{ascending:false});
    setRows(data||[]);
  },[]);
  useEffect(()=>{load();},[load]);

  const cities=useMemo(()=>[...new Set((rows||[]).map(r=>r.city).filter(Boolean))].sort(),[rows]);
  const filtered=useMemo(()=>(rows||[]).filter(r=>{
    if(cityF && r.city!==cityF) return false;
    if(q){ const s=(r.name||"")+" "+(r.phone||""); if(!s.toLowerCase().includes(q.toLowerCase())) return false; }
    return true;
  }),[rows,q,cityF]);

  function exportCsv(){
    const head=[["Name","Phone","City","Location","Outcome","Reached by","Reached at"]];
    filtered.forEach(r=>head.push([r.name||"",r.phone||"",r.city||"",(r.location||"").replace(/\n/g," "),
      t.outcomes[r.status],r.agent_name||"",new Date(r.reached_at).toLocaleString()]));
    const csv="\uFEFF"+head.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="confirmed_clients.csv"; a.click();
    showToast(t.exportCsv+" ✓");
  }

  if(rows===null) return <div className="spin"></div>;
  return (
    <div className="grid" style={{gap:16}}>
      <div className="row" style={{justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{fontSize:20,fontWeight:800}}>✅ {t.confirmedData}</div>
          <div style={{color:"var(--muted)",fontSize:13}}>{rows.length} {t.confirmedCount.toLowerCase()}</div>
        </div>
        <div className="row" style={{gap:8}}>
          <button className="btn-ghost" onClick={load}>↻ {t.refresh}</button>
          <button className="btn-primary" onClick={exportCsv}>⬇ {t.exportCsv}</button>
        </div>
      </div>

      <div className="card" style={{padding:14}}>
        <div className="grid" style={{gridTemplateColumns:"2fr 1fr",gap:10}}>
          <input placeholder={t.search} value={q} onChange={e=>setQ(e.target.value)}/>
          <select value={cityF} onChange={e=>setCityF(e.target.value)}>
            <option value="">{t.allCities}</option>
            {cities.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      </div>

      <div className="card" style={{overflow:"auto"}}>
        {filtered.length===0? <div style={{padding:40,textAlign:"center",color:"var(--muted)"}}>{t.noConfirmed}</div> :
        <table>
          <thead><tr><th>{t.name}</th><th>{t.phone}</th><th>{t.city}</th>
            <th>{t.location}</th><th>{t.outcome}</th><th>{t.reachedBy}</th><th>{t.reachedAt}</th></tr></thead>
          <tbody>
          {filtered.map(r=>(
            <tr key={r.id}>
              <td style={{fontWeight:600}}>{r.name||"—"}</td>
              <td>{r.phone}</td>
              <td style={{color:"var(--muted)"}}>{r.city||"—"}</td>
              <td style={{maxWidth:240,color:"var(--muted)",fontSize:13}}>{r.location||"—"}</td>
              <td><Pill outcome={r.status} t={t}/></td>
              <td style={{color:"var(--muted)"}}>{r.agent_name}</td>
              <td style={{color:"var(--muted)",fontSize:12,whiteSpace:"nowrap"}}>{fmtDate(r.reached_at,t.dir)}</td>
            </tr>
          ))}
          </tbody>
        </table>}
      </div>
    </div>
  );
}

/* ==================== ADMIN: IMPORT NEW CLIENTS ==================== */
// Normalize an Egyptian phone the same way the original cleaning did.
function normPhone(raw){
  let d=(raw||"").replace(/\D/g,"");
  if(d.length===11 && d.startsWith("01") && "0125".includes(d[2])) return d;
  if(d.length===10 && d[0]==="1" && "0125".includes(d[1])) return "0"+d;
  return null; // not a clean 11-digit mobile → treated as invalid for import
}
function parseSheet(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows=[];
  for(const line of lines){
    // split on comma or tab
    const parts=line.split(/\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(p=>p.replace(/^"|"$/g,"").trim());
    rows.push(parts);
  }
  if(rows.length===0) return [];
  // detect header row: if first row's 2nd cell isn't a phone-like value
  const looksHeader = rows[0].some(c=>/name|phone|city|location|الاسم|الهاتف|المدينة|العنوان/i.test(c));
  const body = looksHeader? rows.slice(1): rows;
  return body.map(r=>({name:(r[0]||"").trim(), phoneRaw:(r[1]||"").trim(),
    city:(r[2]||"").trim(), location:(r[3]||"").trim()}));
}

function AdminImport({t,showToast}){
  const [text,setText]=useState("");
  const [analysis,setAnalysis]=useState(null);
  const [busy,setBusy]=useState(false);
  const fileRef=useRef(null);

  async function analyze(raw){
    const parsed=parseSheet(raw);
    // normalize + split valid/invalid + dedupe within paste
    const seen=new Set(); const valid=[]; const invalid=[];
    for(const row of parsed){
      const p=normPhone(row.phoneRaw);
      if(!p){ invalid.push(row); continue; }
      if(seen.has(p)) continue; // duplicate within the paste itself
      seen.add(p);
      valid.push({...row, phone:p});
    }
    // check which already exist in DB (query in chunks)
    const phones=valid.map(v=>v.phone);
    const existing=new Set();
    for(let i=0;i<phones.length;i+=500){
      const chunk=phones.slice(i,i+500);
      const {data}=await sb.from("clients").select("phone").in("phone",chunk);
      (data||[]).forEach(r=>existing.add(r.phone));
    }
    const toAdd=valid.filter(v=>!existing.has(v.phone));
    const dup=valid.filter(v=>existing.has(v.phone));
    setAnalysis({total:parsed.length, toAdd, dup, invalid});
  }

  function onText(v){ setText(v); if(v.trim()) analyze(v); else setAnalysis(null); }
  function onFile(e){
    const f=e.target.files?.[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ setText(r.result); analyze(r.result); };
    r.readAsText(f);
  }

  async function runImport(){
    if(!analysis || analysis.toAdd.length===0){ showToast(t.nothingToImport,true); return; }
    setBusy(true);
    const rows=analysis.toAdd.map(v=>({name:v.name||null, phone:v.phone,
      city:v.city||null, location:v.location||null, status:"new"}));
    let added=0;
    // insert in chunks; ignore duplicates that slip in via the unique constraint
    for(let i=0;i<rows.length;i+=500){
      const chunk=rows.slice(i,i+500);
      const {data,error}=await sb.from("clients").insert(chunk).select("id");
      if(!error && data) added+=data.length;
      else if(error){
        // fallback: constraint may reject a race dup — insert one by one
        for(const one of chunk){
          const {error:e1}=await sb.from("clients").insert(one);
          if(!e1) added++;
        }
      }
    }
    setBusy(false);
    const skipped=analysis.dup.length + (analysis.toAdd.length-added);
    showToast(t.importDone.replace("{a}",added).replace("{s}",skipped));
    setText(""); setAnalysis(null);
    if(fileRef.current) fileRef.current.value="";
  }

  return (
    <div className="grid" style={{gap:16,maxWidth:760}}>
      <div style={{fontSize:20,fontWeight:800}}>{t.importClients}</div>

      <div className="card" style={{padding:18}}>
        <label className="fld"><span>{t.pasteHere}</span>
          <textarea rows="8" value={text} onChange={e=>onText(e.target.value)}
            placeholder="name, phone, city, location" style={{fontFamily:"monospace",fontSize:13}}></textarea>
        </label>
        <div style={{fontSize:12,color:"var(--muted)",marginBottom:12}}>{t.pasteHint}</div>
        <div className="row" style={{gap:10}}>
          <input ref={fileRef} type="file" accept=".csv,text/csv,text/plain" onChange={onFile}
            style={{width:"auto",flex:1}}/>
          {text && <button className="btn-ghost" onClick={()=>{setText("");setAnalysis(null);if(fileRef.current)fileRef.current.value="";}}>{t.clearImport}</button>}
        </div>
      </div>

      {analysis && (
        <div className="card" style={{padding:18}}>
          <div style={{fontWeight:700,marginBottom:14}}>{t.preview} · {analysis.total} {t.rowsFound}</div>
          <div className="grid" style={{gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:16}}>
            <div className="mini card" style={{border:"1px solid var(--green)"}}>
              <div className="num" style={{color:"var(--green)"}}>{analysis.toAdd.length}</div>
              <div className="lbl">{t.willAdd}</div></div>
            <div className="mini card" style={{border:"1px solid var(--amber)"}}>
              <div className="num" style={{color:"var(--amber)"}}>{analysis.dup.length}</div>
              <div className="lbl">{t.willSkip}</div></div>
            <div className="mini card" style={{border:"1px solid var(--slate)"}}>
              <div className="num" style={{color:"var(--slate)"}}>{analysis.invalid.length}</div>
              <div className="lbl">{t.invalid}</div></div>
          </div>

          {analysis.toAdd.length>0 &&
            <div style={{maxHeight:220,overflow:"auto",border:"1px solid var(--line)",borderRadius:10,marginBottom:16}}>
              <table><thead><tr><th>{t.name}</th><th>{t.phone}</th><th>{t.city}</th></tr></thead>
                <tbody>
                {analysis.toAdd.slice(0,50).map((v,i)=>(
                  <tr key={i}><td>{v.name||"—"}</td><td>{v.phone}</td><td style={{color:"var(--muted)"}}>{v.city||"—"}</td></tr>
                ))}
                </tbody></table>
              {analysis.toAdd.length>50 && <div style={{padding:"8px 12px",color:"var(--muted)",fontSize:12}}>+{analysis.toAdd.length-50}…</div>}
            </div>}

          <button className="btn-primary" style={{width:"100%"}} disabled={busy||analysis.toAdd.length===0}
            onClick={runImport}>{busy?t.importing:t.runImport+" ("+analysis.toAdd.length+")"}</button>
        </div>
      )}
    </div>
  );
}

/* ==================== ROOT APP ==================== */
function App(){
  const [lang,setLang]=useState("ar");
  const [session,setSession]=useState(undefined); // undefined=loading
  const [me,setMe]=useState(null);
  const [tab,setTab]=useState("dashboard");
  const [toastNode,showToast]=useToast();
  const t=T[lang];

  useEffect(()=>{
    document.body.dir=t.dir; document.documentElement.lang=lang;
  },[lang]);

  const loadMe=useCallback(async(uid)=>{
    const {data}=await sb.from("profiles").select("*").eq("id",uid).single();
    setMe(data);
    setTab(data?.role==="admin"?"dashboard":"mycalls");
  },[]);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>{
      setSession(data.session);
      if(data.session) loadMe(data.session.user.id);
    });
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>{
      setSession(s);
      if(s) loadMe(s.user.id); else setMe(null);
    });
    return ()=>sub.subscription.unsubscribe();
  },[loadMe]);

  async function logout(){ await sb.auth.signOut(); setMe(null); }

  if(session===undefined) return <div className="spin"></div>;
  if(!session) return <Login lang={lang} setLang={setLang} onLogin={()=>{}}/>;
  if(!me) return <div className="spin"></div>;

  const adminTabs=[["dashboard",t.dashboard],["assign",t.assign],["import",t.importT],["reports",t.reports],["confirmed",t.confirmed]];

  return (
    <div>
      <Header t={t} lang={lang} setLang={setLang} me={me} onLogout={logout}/>
      <div style={{maxWidth:1180,margin:"0 auto",padding:"20px 18px 60px"}}>
        {me.role==="admin" && (
          <div className="tabbar" style={{marginBottom:20,maxWidth:700}}>
            {adminTabs.map(([k,l])=>(
              <button key={k} className={tab===k?"active":""} onClick={()=>setTab(k)}>{l}</button>
            ))}
          </div>
        )}
        {me.role==="admin"? (
          tab==="dashboard"? <AdminDashboard t={t}/> :
          tab==="assign"? <AdminAssign t={t} showToast={showToast}/> :
          tab==="import"? <AdminImport t={t} showToast={showToast}/> :
          tab==="confirmed"? <AdminConfirmed t={t} showToast={showToast}/> :
          <AdminReports t={t} showToast={showToast}/>
        ) : (
          <AgentView t={t} me={me} showToast={showToast}/>
        )}
      </div>
      {toastNode}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
